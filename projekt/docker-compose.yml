services:
  postgres:
    image: postgres:16-alpine
    container_name: diskrak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diskrak_db
      POSTGRES_USER: diskrak_user
      POSTGRES_PASSWORD: diskrak_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diskrak_user -d diskrak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: diskrak_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
