spring:
  application:
    name: diskrak-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/diskrak_db
    username: diskrak_user
    password: diskrak_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
